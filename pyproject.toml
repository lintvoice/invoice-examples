[project]
name = "invoice-examples"
version = "0.8.0"
description = "Valid and invalid e-invoice examples (CII XML, Factur-X / ZUGFeRD PDF), each invalid one failing a named rule: EN 16931, then each country's own rules, France first. CC0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AllGood Services SAS" }]
dependencies = [
    "lxml>=6.1",
    "pypdf>=6.21.4",  # 7 CVEs (crafted PDFs: infinite loops, memory) fixed in 6.21.3 and 6.21.4
    "reportlab>=5.1",
]
keywords = ["e-invoice", "invoice", "examples", "test", "factur-x", "zugferd", "cii", "en16931", "br-fr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://lintvoice.com/examples"
Source = "https://github.com/lintvoice/invoice-examples"

[project.scripts]
invoice-examples = "invoice_examples.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "saxonche>=13.1,<14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = [".rules-cache", "examples"]

[tool.ruff.lint]
# Curated set: errors, likely bugs, security, modern syntax, simplifications, Ruff's own rules.
select = ["E", "F", "W", "B", "S", "UP", "SIM", "RUF", "C4", "PERF"]
# Long lines are the formatter's call; ×, ✓, « » and other non-ASCII characters are intended; PERF401 flags
# loops whose side effects (files written, rules seen) a comprehension would hide.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "PERF401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S310"]  # asserts and subprocesses are what tests are made of
